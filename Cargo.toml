[package]
name = "opticode"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "entity", "migration"]

[dependencies]
entity = { path = "entity" }
migration = { path = "migration" }
actix-web = "4.13.0"
dotenv = "0.15.0"
env_logger = "0.11.9"
lazy_static = "1.5.0"
serde = "1.0.228"
serde_json = "1.0.149"
sea-orm = { version = "2.0.0-rc", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros" ] }
sha256 = "1.6.0"
chrono = "0.4.44"
jsonwebtoken = {version = "10.3.0", features = ["rust_crypto"]}
a = "0.1.1"
actix-multipart = "0.7.2"
sanitize-filename = "0.6.0"

[dependencies.uuid]
version = "1.23.0"
# Lets you generate random UUIDs
features = [
    "v4",
    "fast-rng",
    "macro-diagnostics"
]
